<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HouseFix</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <div id="header-container"></div>
      <div id="nav-container"></div>
    </header>

    <main>
      <div id="hero-container"></div>
      <div id="services-container"></div>
      <div id="about-container"></div>
      <div id="pricing-container"></div>
      <div id="recent-works-container"></div>
      <div id="stats-container"></div>
      <div id="partners-container"></div>
      <div id="blog-container"></div>
    </main>

    <div id="footer-container"></div>
    <script>
      async function loadComponent(id, path) {
        try {
          const response = await fetch(path);
          if (!response.ok) throw new Error(`Status: ${response.status}`);
          const html = await response.text();

          const container = document.getElementById(id);
          container.innerHTML = html;

          const scripts = container.querySelectorAll('script');
          scripts.forEach(oldScript => {
            const newScript = document.createElement('script');
            Array.from(oldScript.attributes).forEach(attr => {
              newScript.setAttribute(attr.name, attr.value);
            });
            if (!oldScript.src) {
              newScript.textContent = oldScript.textContent;
            }
            oldScript.parentNode.replaceChild(newScript, oldScript);
          });

        } catch (err) {
          console.error(`❌ Gagal memuat ${path}:`, err);
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        loadComponent('header-container',      'components/header.html');
        loadComponent('nav-container',         'components/nav.html');
        loadComponent('hero-container',        'components/hero.html');
        loadComponent('services-container',    'components/services.html');
        loadComponent('about-container',       'components/about.html');
        loadComponent('pricing-container',     'components/pricing.html');
        loadComponent('recent-works-container','components/recent-works.html');
        loadComponent('stats-container',       'components/stats.html');
        loadComponent('partners-container',    'components/partners.html');
        loadComponent('blog-container',       'components/blog.html');
        loadComponent('footer-container',      'components/footer.html');
      });
      </script>
  </body>
</html>
