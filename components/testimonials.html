<section class="stats py-5 bg-primary text-white">

    <div class="container">

        <div class="text-center mb-5">

            <h2 class="fw-bold">
                Providing excellent services for the last 25 years
            </h2>

        </div>

        <div class="row g-4 text-center">

            <div class="col-6 col-lg-3">

                <div class="stat-card">

                    <h3 class="display-5 fw-bold">
                        1200+
                    </h3>

                    <p class="mb-0">
                        Happy Customers
                    </p>

                </div>

            </div>

            <div class="col-6 col-lg-3">

                <div class="stat-card">

                    <h3 class="display-5 fw-bold">
                        8,714+
                    </h3>

                    <p class="mb-0">
                        Installed Units
                    </p>

                </div>

            </div>

            <div class="col-6 col-lg-3">

                <div class="stat-card">

                    <h3 class="display-5 fw-bold">
                        1600+
                    </h3>

                    <p class="mb-0">
                        Home Served
                    </p>

                </div>

            </div>

            <div class="col-6 col-lg-3">

                <div class="stat-card">

                    <h3 class="display-5 fw-bold">
                        500+
                    </h3>

                    <p class="mb-0">
                        Professional
                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

<script>
function initStats() {
  const statSection = document.querySelector('.stats');
  const statElements = document.querySelectorAll('.stat-card h3');
  let animated = false;

  const targets = [1200, 8714, 1600, 500];

  function animateNumber(el, finalValue) {
    let current = 0;
    const duration = 2000;
    const interval = 20;
    const steps = duration / interval;
    const increment = finalValue / steps;

    const counter = setInterval(() => {
      current += increment;
      if (current >= finalValue) {
        el.textContent = finalValue.toLocaleString() + '+';
        clearInterval(counter);
      } else {
        el.textContent = Math.floor(current).toLocaleString() + '+';
      }
    }, interval);
  }

  function checkScroll() {
    if (animated) return;
    const rect = statSection.getBoundingClientRect();
    if (rect.top < window.innerHeight - 80) {
      animated = true;
      statElements.forEach((el, index) => animateNumber(el, targets[index]));
    }
  }

  window.addEventListener('scroll', checkScroll);
  checkScroll();
}

initStats();
</script>
