<section class="recentWorks py-5 bg-light">

    <div class="container">

        <div class="text-center mb-5">

            <a class="nav-link text-primary fw-bold mb-2" href="#">
                Featured Projects
            </a>

            <h1 class="fw-bold mb-4">
                Our Recent Works
            </h1>

            <div class="d-flex flex-wrap justify-content-center gap-3">

                <span class="fw-bold">All Projects</span>
                <span class="fw-bold">Commercial Services</span>
                <span class="fw-bold">Residential Services</span>
                <span class="fw-bold">Emergency Services</span>

            </div>

        </div>

        <div class="row g-4">

            <div class="col-12 col-sm-6 col-lg-4">
                <img src="img/Recent Works/Image-Container.jpg" class="img-fluid rounded recent-img" alt="">
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <img src="img/Recent Works/Image-Container-1.jpg" class="img-fluid rounded recent-img" alt="">
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <img src="img/Recent Works/Image-Container-2.jpg" class="img-fluid rounded recent-img" alt="">
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <img src="img/Recent Works/Image-Container-3.jpg" class="img-fluid rounded recent-img" alt="">
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <img src="img/Recent Works/Image-Container-4.jpg" class="img-fluid rounded recent-img" alt="">
            </div>

            <div class="col-12 col-sm-6 col-lg-4">
                <img src="img/Recent Works/Image-Container-5.jpg" class="img-fluid rounded recent-img" alt="">
            </div>

        </div>

    </div>

</section>

<script>
function initRecentWorks() {
  const section = document.querySelector('.recentWorks');
  const tabs = document.querySelectorAll('.recentWorks .fw-bold');
  const images = document.querySelectorAll('.recent-img');
  let isAnimated = false;

  images.forEach(img => {
    img.style.opacity = '0';
    img.style.transform = 'translateY(30px)';
    img.style.transition = 'all 0.6s ease';
  });

  function checkScroll() {
    if (isAnimated) return;
    const sectionTop = section.getBoundingClientRect().top;
    if (sectionTop < window.innerHeight - 100) {
      isAnimated = true;
      images.forEach((img, index) => {
        setTimeout(() => {
          img.style.opacity = '1';
          img.style.transform = 'translateY(0)';
        }, index * 120);
      });
    }
  }

  window.addEventListener('scroll', checkScroll);
  checkScroll();

  tabs.forEach(tab => {
    tab.style.cursor = 'pointer';
    tab.style.transition = 'color 0.2s ease';
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('text-primary'));
      tab.classList.add('text-primary');
    });
  });

  images.forEach(img => {
    img.addEventListener('mouseover', () => {
      img.style.transform = 'scale(1.05)';
      img.style.boxShadow = '0 8px 20px rgba(0,0,0,0.12)';
    });
    img.addEventListener('mouseout', () => {
      img.style.transform = 'scale(1)';
      img.style.boxShadow = 'none';
    });
  });
}
initRecentWorks();
</script>
