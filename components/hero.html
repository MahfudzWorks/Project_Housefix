<section class="hero py-5 d-flex align-items-center bg-light">
    <div class="container">
        <div class="row align-items-center g-4">
            <div class="col-lg-6 text-center text-lg-start">
                <h1 class="fw-bold mb-3 fs-3 fs-md-2 fs-lg-1 text-primary-900">
                    Plumbing Experts Right at Your Doorstep
                </h1>
                <p class="text-muted mb-4 fs-6 fs-md-5">
                    Our plumbers are the most recognized professionals in the industry, delivering fast, reliable, and affordable solutions for all your plumbing needs.
                </p>
                <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center justify-content-lg-start">
                    <button id="btnEstimate" class="btn btn-primary px-4 py-2">
                        Request a Job Estimate
                    </button>
                    <button id="btnPricing" class="btn btn-outline-primary px-4 py-2">
                        Pricing Plans
                    </button>
                </div>
            </div>
            <div class="col-lg-6 text-center mt-5 mt-lg-0">
                <img 
                    src="img/Image-Container.svg" 
                    class="img-fluid hero-img w-100" 
                    alt="Plumbing Service">
            </div>
        </div>
    </div>
</section>

<script>
function initHero() {
    const btnEstimate = document.getElementById('btnEstimate');
    const btnPricing = document.getElementById('btnPricing');

    if (!btnEstimate || !btnPricing) return;

    btnEstimate.addEventListener('click', function() {
        console.log('Tombol Request Estimate diklik');

        document.querySelector('#pricing-container, #form-container')?.scrollIntoView({
            behavior: 'smooth'
        });
    });

    btnPricing.addEventListener('click', function() {
        console.log('Tombol Pricing diklik');
        document.getElementById('pricing-container')?.scrollIntoView({
            behavior: 'smooth'
        });
    });

    const heroSection = document.querySelector('.hero');
    if (heroSection) {
        heroSection.style.opacity = '0';
        heroSection.style.transform = 'translateY(20px)';
        heroSection.style.transition = 'all 0.6s ease-out';

        setTimeout(() => {
            heroSection.style.opacity = '1';
            heroSection.style.transform = 'translateY(0)';
        }, 100);
    }
}

initHero();
</script>
