<section class="aboutUs py-5">

    <div class="container">

        <div class="row align-items-center g-5">

            <div class="col-lg-6 text-center order-2 order-lg-1">

                <img
                    class="img-fluid rounded-4 shadow about-img"
                    src="img/Image-Container.png"
                    alt="About Us Image">

            </div>

            <div class="col-lg-6 order-1 order-lg-2 text-center text-lg-start">

                <h1 class="fw-bold mb-4">
                    Taking regular plumbing care will save you time and money
                </h1>

                <p class="text-secondary mb-4">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit,
                    sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                </p>

                <div class="d-flex flex-column gap-3 mb-4">

                    <div class="d-flex align-items-center gap-3 justify-content-center justify-content-lg-start">
                        <img src="img/Check.svg" width="20">
                        <h5 class="fw-bold m-0">Praesent Sodales Orci</h5>
                    </div>

                    <div class="d-flex align-items-center gap-3 justify-content-center justify-content-lg-start">
                        <img src="img/Check.svg" width="20">
                        <h5 class="fw-bold m-0">Curabitur Dignissim</h5>
                    </div>

                    <div class="d-flex align-items-center gap-3 justify-content-center justify-content-lg-start">
                        <img src="img/Check.svg" width="20">
                        <h5 class="fw-bold m-0">Nulla Condimentum</h5>
                    </div>

                </div>

                <button class="btn btn-primary px-4 py-2 rounded-pill">
                    More About Us ↗
                </button>

            </div>

        </div>

    </div>

</section>

<script>
function initAboutUs() {
  const aboutImg = document.querySelector('.about-img');
  const checkItems = document.querySelectorAll('.aboutUs .d-flex > img');
  const btnMore = document.querySelector('.aboutUs .btn');

  if (aboutImg) {
    aboutImg.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
    aboutImg.addEventListener('mouseover', () => {
      aboutImg.style.transform = 'scale(1.03)';
      aboutImg.style.boxShadow = '0 10px 25px rgba(0,0,0,0.15)';
    });
    aboutImg.addEventListener('mouseout', () =>
      {
        aboutImg.style.transform = 'scale(1)';
        aboutImg.style.boxShadow = '0 0.5rem 1rem rgba(0,0,0,0.15)';
      });
  }

  checkItems.forEach(img => {
    img.style.transition = 'transform 0.2s ease';
    img.addEventListener('mouseover', () => img.style.transform = 'scale(1.15)');
    img.addEventListener('mouseout', () => img.style.transform = 'scale(1)');
  });

  if (btnMore) {
    btnMore.addEventListener('click', () => {
      document.querySelector('#about-container')?.scrollIntoView({ behavior: 'smooth' });
    });
  }
}
initAboutUs();
</script>
