<section class="stats py-5 bg-primary text-white">

    <div class="container">

        <div class="text-center mb-5">

            <h2 class="fw-bold">
                Providing excellent services for the last 25 years
            </h2>

        </div>

        <div class="row g-4 text-center">

            <div class="col-6 col-lg-3">

                <div class="stat-card">

                    <h3 class="display-5 fw-bold">
                        1200+
                    </h3>

                    <p class="mb-0">
                        Happy Customers
                    </p>

                </div>

            </div>

            <div class="col-6 col-lg-3">

                <div class="stat-card">

                    <h3 class="display-5 fw-bold">
                        8,714+
                    </h3>

                    <p class="mb-0">
                        Installed Units
                    </p>

                </div>

            </div>

            <div class="col-6 col-lg-3">

                <div class="stat-card">

                    <h3 class="display-5 fw-bold">
                        1600+
                    </h3>

                    <p class="mb-0">
                        Home Served
                    </p>

                </div>

            </div>

            <div class="col-6 col-lg-3">

                <div class="stat-card">

                    <h3 class="display-5 fw-bold">
                        500+
                    </h3>

                    <p class="mb-0">
                        Professional
                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

<script>
function initStats() {
  const statNumbers = document.querySelectorAll('.stat-card h3');
  const section = document.querySelector('.stats');
  let started = false;

  function animateCount(el, target) {
    let current = 0;
    const duration = 2000;
    const stepTime = 20;
    const steps = duration / stepTime;
    const increment = target / steps;
    const hasPlus = el.textContent.includes('+');

    const timer = setInterval(() => {
      current += increment;
      if (current >= target) {
        el.textContent = target + (hasPlus ? '+' : '');
        clearInterval(timer);
      } else {
        el.textContent = Math.floor(current) + (hasPlus ? '+' : '');
      }
    }, stepTime);
  }

  function startAnimation() {
    if (started) return;
    const rect = section.getBoundingClientRect();
    if (rect.top < window.innerHeight - 100) {
      started = true;
      const values = [1200, 8714, 1600, 500];
      statNumbers.forEach((el, i) => animateCount(el, values[i]));
    }
  }

  window.addEventListener('scroll', startAnimation);
  startAnimation();
}
initStats();
</script>
